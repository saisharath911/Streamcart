# Serves the dashboard and routes API paths to each service, exactly like the AWS ALB rules.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/orders      { proxy_pass http://orders:8080; }
  location /api/products    { proxy_pass http://inventory:8080; }
  location /api/reservations { proxy_pass http://inventory:8080; }
  location /api/inventory   { proxy_pass http://inventory:8080; }
  location /api/payments    { proxy_pass http://payments:8080; }
  location /api/chaos       { proxy_pass http://payments:8080; }

  location /hubs/ {
    proxy_pass http://orders:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
